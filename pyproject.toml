[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kxn-digraph"
version = "0.1.0"
description = "Functional digraph of x -> k x^n modulo m: brute force, closed forms, exact statistics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wei Chen" }]
dependencies = ["sympy>=1.12", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/Wei-Chen-7/Map-kx-Modulo-m"

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
kxn = "kxn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
